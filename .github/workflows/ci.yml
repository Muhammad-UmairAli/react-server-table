name: CI

# Runs the same hooks defined in .pre-commit-config.yaml on every PR into a
# protected branch. Catches issues from developers who haven't run
# `pre-commit install` locally.
#
# Only `pull_request` is used: branch protection forces every change through a
# PR, so PR runs already cover all work. (A `push` trigger on feature branches
# double-runs alongside the PR run; the concurrency guard then cancels one,
# which GitHub surfaces as a spurious failed check — so we don't use it.)
#
# Failing CI blocks the merge per the branch-protection ruleset
# (see .github/rulesets/main.json and develop.json once you wire
# required_status_checks).
#
# See docs/methodology/04-code-quality-and-gates.md.

on:
  pull_request:
    branches: [main, develop]

# Cancel an in-progress run when the PR head is updated with a new push.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  pre-commit:
    name: Pre-commit hooks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: pre-commit/action@v3.0.1
